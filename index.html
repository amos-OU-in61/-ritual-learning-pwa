<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>禮節背誦學習</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="禮節">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#18202a;background:#f5f6f8}*{box-sizing:border-box}body{margin:0;-webkit-tap-highlight-color:transparent}.app{max-width:920px;margin:auto;min-height:100vh;background:#fff}.top{position:sticky;top:0;z-index:20;padding:14px 16px;background:#fff;border-bottom:1px solid #ddd;display:flex;gap:8px;align-items:center}.top h1{font-size:20px;margin:0;flex:1}.back,.stop,.lang,.voice{border:0;background:#eee;border-radius:10px;padding:9px 11px;font-size:15px}.stop{background:#fbe5e5;color:#8b1b1b}.lang{background:#e5eef8;color:#173f70}.voice{background:#f3e8fb;color:#5e277d;white-space:nowrap}.content{padding:16px 16px 170px}.menu{display:grid;gap:12px}.menu button{padding:20px 16px;text-align:left;border:1px solid #d8dde5;background:#fff;border-radius:14px;font-size:19px;font-weight:700}.menu small{display:block;color:#6c7480;font-weight:400;margin-top:4px}.selector{display:flex;gap:8px;margin-bottom:14px}.selector button{flex:1;border:1px solid #bcc5d0;background:#fff;padding:11px;border-radius:10px;font-size:17px}.selector button.active{background:#173f70;color:#fff;border-color:#173f70}.ritual{border-collapse:collapse;width:100%;font-size:16px}.ritual th,.ritual td{border:1px solid #aeb4bc;padding:8px;vertical-align:middle}.ritual th{background:#f0f2f5}.ritual .intro-row td{background:#fff;text-align:center;font-weight:600;padding:10px}.ritual .upper{width:55%}.ritual .lower{width:30%}.ritual .note{width:15%;font-size:13px}.cellplay{cursor:pointer}.phrase{border:0;background:#fff;border-radius:8px;padding:7px 9px;margin:2px;font-size:16px;box-shadow:inset 0 0 0 1px #b8bec6}.phrase:active{transform:scale(.98)}.phrase.blue{background:#1565c0;color:#fff}.phrase.red{background:#c62828;color:#fff}.pinyin{display:block;font-size:11px;margin-top:3px;opacity:.78}.block-blue td{background:#dceeff}.block-gray td{background:#e7e7e7}.block-orange td{background:#ffe5c1}.block-red td{background:#ffd7d7}.block-control td{background:#fff!important;padding:7px}.block-play{width:100%;border:1px solid #8293a8;background:#edf3fa;color:#173f70;border-radius:8px;padding:11px;font-size:15px;font-weight:700}.daily-red td{background:#f4cccc}.daily-yellow td{background:#fff2cc}.daily-green td{background:#d9ead3}.daily-sky td{background:#cfe2f3}.daily-purple td{background:#d9d2e9}.daily-pink td{background:#ead1dc}.daily-salmon td{background:#e6b8af}.daily-blue td{background:#c9daf8}.cell-prompt{display:block;margin:8px 2px 2px;color:#4d5560;font-size:14px}.daily-group .block-control td{background:#fff!important}.info{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(920px,100%);background:#fff;border-top:2px solid #173f70;padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:30;min-height:110px}.info h2{font-size:18px;margin:0 0 5px}.info p{margin:3px 0;color:#4d5560}.pending{padding:28px 16px;border:1px dashed #aaa;border-radius:12px;text-align:center;color:#68717c}.hidden{display:none!important}@media(max-width:600px){.ritual{font-size:14px}.phrase{font-size:14px;padding:7px}.ritual th,.ritual td{padding:5px}.note{display:none}.ritual .upper{width:62%}.ritual .lower{width:38%}.top{padding:10px 8px;gap:5px}.top h1{font-size:18px}.back,.stop,.lang,.voice{padding:8px;font-size:14px}}
</style></head>
<body><div class="app"><header class="top"><button id="back" class="back hidden" aria-label="返回首頁">←</button><h1 id="title">禮節背誦學習</h1><button id="voice" class="voice">男聲</button><button id="lang" class="lang">English</button><button id="stop" class="stop hidden">停止</button></header><main id="main" class="content"></main><aside id="info" class="info" aria-live="polite"><h2>說明</h2><p>點選禮節內容可查看說明。</p></aside></div>
<script src="data/daily-incense.js"></script><script src="data/lessons.js"></script><script>
const main=document.querySelector('#main'),title=document.querySelector('#title'),back=document.querySelector('#back'),stopBtn=document.querySelector('#stop'),langBtn=document.querySelector('#lang'),voiceBtn=document.querySelector('#voice'),info=document.querySelector('#info');
let aud=null,playToken=0,currentPage='home',currentMode='',language=localStorage.getItem('ritual-language')||'zh',voice=localStorage.getItem('ritual-voice')||'male';
function tr(zh,en){return language==='en'?en:zh}
function defaultInfo(message=tr('點選禮節內容可查看說明。','Select a ritual item to view its explanation.')){info.innerHTML=`<h2>${tr('說明','Information')}</h2><p>${message}</p>`}
function stop(showDefault=false){playToken++;if(aud){aud.pause();aud.removeAttribute('src');aud.load();aud=null}stopBtn.classList.add('hidden');if(showDefault)defaultInfo()}
window.stopAudio=()=>stop(false);
function showInfo(item){const body=language==='en'?(item.english||'English explanation will be added later.'):(item.description||'此項說明將於後續版本補充。');info.innerHTML=`<h2>${item.text||'說明'}</h2><p>${body}</p>`}
function status(s){info.innerHTML=`<h2>${tr('播放中','Playing')}</h2><p>${s}</p>`}
function missingAudio(name=''){info.innerHTML=`<h2>${tr('音訊尚未提供','Audio not yet available')}</h2><p>${name||tr('此按鈕的錄音將於後續版本加入。','This recording will be added in a later version.')}</p>`}
function voiceSrc(src){
  if(voice!=='female'||!src)return src;
  if(src==='audio/daily/天地君親師.mp3')return 'audio/replacements-v049/天地君親師F.mp3';
  if(src==='audio/blocks/3pxg1.mp3')return 'audio/replacements-v049/3pxg1F.mp3';
  if(src==='audio/replacements-v049/獻供茶禮畢鞠躬.mp3')return 'audio/replacements-v049/獻供茶禮畢鞠躬F.mp3';
  if(src==='audio/replacements-v051/參駕禮畢鞠躬.mp3')return 'audio/replacements-v051/參駕禮畢鞠躬F.mp3';
  if(src==='audio/replacements-v051/辭駕禮畢鞠躬.mp3')return 'audio/replacements-v051/辭駕禮畢鞠躬F.mp3';
  return src.replace(/^audio\//,'audio/female-v047/').replace(/\.mp3$/i,'F.mp3');
}
function playFile(src,onend,token,label=''){if(aud){aud.pause();aud=null}if(!src){missingAudio(label);return}aud=new Audio(voiceSrc(src));stopBtn.classList.remove('hidden');aud.onended=()=>{aud=null;if(token===playToken){stopBtn.classList.add('hidden');onend&&onend()}};aud.onerror=()=>{aud=null;stopBtn.classList.add('hidden');missingAudio(label)};aud.play().catch(()=>missingAudio(label))}
function phraseBtn(item){const b=document.createElement('button');b.className='phrase '+(item.color||'');b.innerHTML=`<span>${item.text}</span>${language==='en'&&item.pinyin?`<small class="pinyin">${item.pinyin}</small>`:''}`;b.onclick=e=>{e.stopPropagation();stop(false);showInfo(item);const token=playToken;playFile(item.audio,()=>{},token,item.text)};return b}
function playSequence(items,cellAudio=''){stop(false);const token=playToken;status(tr('正在播放本段禮節……','Playing this ritual cell…'));if(cellAudio){playFile(cellAudio,()=>defaultInfo(),token,items.map(x=>x.text).join('、'));return}const next=i=>{if(token!==playToken)return;if(i>=items.length){defaultInfo();return}playFile(items[i].audio,()=>next(i+1),token,items[i].text)};next(0)}
function playBlock(code){stop(false);const src=`audio/blocks/${code}.mp3`,token=playToken;status(tr(`正在播放區塊 ${code}……`,`Playing section ${code}…`));playFile(src,()=>defaultInfo(),token,code)}
function visibleForVoice(item){if(item.text==='餘蘊弟子')return voice==='male';if(item.text==='餘蘊信士'||item.text==='餘蘊信女')return voice==='female';return true}
function makeRow(row){const tr=document.createElement('tr');if(row.styleClass)tr.className=row.styleClass;['upper','lower','note'].forEach(k=>{const td=document.createElement('td');td.className=k;const items=Array.isArray(row[k])?row[k].filter(visibleForVoice):row[k];if(k==='upper'&&items?.length){if(row.cellPlayable!==false){td.classList.add('cellplay');td.onclick=e=>{e.stopPropagation();playSequence(items,row.cellAudio)}}items.forEach(x=>td.appendChild(phraseBtn(x)));if(row.prompt){const p=document.createElement('span');p.className='cell-prompt';p.textContent=`（${row.prompt}）`;td.appendChild(p)}}else if(Array.isArray(items))items.forEach(x=>td.appendChild(phraseBtn(x)));else td.textContent=items||'';tr.appendChild(td)});return tr}
function table(rows,intro=''){const t=document.createElement('table');t.className='ritual';t.innerHTML=`<thead><tr><th>${tr('上禮','Upper Ritual')}</th><th>${tr('下禮','Lower Ritual')}</th><th class="note">${tr('說明','Notes')}</th></tr>${intro?`<tr class="intro-row"><td colspan="2">${intro}</td><td class="note"></td></tr>`:''}</thead>`;let i=0;while(i<rows.length){const first=rows[i],grouped=!!first.block,tb=document.createElement('tbody');if(grouped){tb.className=first.block;const code=first.blockCode;while(i<rows.length&&rows[i].block===first.block&&rows[i].blockCode===code){tb.appendChild(makeRow(rows[i].row));i++}if(code){const row=document.createElement('tr');row.className='block-control';const td=document.createElement('td');td.colSpan=3;const b=document.createElement('button');b.className='block-play';b.textContent=`${tr('念誦以上區塊','Recite the section above')}（${code}）`;b.onclick=()=>playBlock(code);td.appendChild(b);row.appendChild(td);tb.appendChild(row)}}else{tb.appendChild(makeRow(first.row));i++}t.appendChild(tb)}return t}
function selector(labels,active,onchange){const d=document.createElement('div');d.className='selector';labels.forEach(x=>{const b=document.createElement('button');b.textContent=x.label;b.className=x.value===active?'active':'';b.onclick=()=>onchange(x.value);d.appendChild(b)});return d}
function saveState(){localStorage.setItem('ritual-state',JSON.stringify({page:currentPage,mode:currentMode,scrollY:window.scrollY}));localStorage.setItem('ritual-language',language);localStorage.setItem('ritual-voice',voice)}
function updateVoiceButton(){voiceBtn.textContent=voice==='male'?tr('男聲','Male'):tr('女聲','Female');voiceBtn.setAttribute('aria-label',tr('切換男聲或女聲','Switch male or female voice'))}
function home(){stop();currentPage='home';currentMode='';saveState();title.textContent=tr('禮節背誦學習','Lijie Ritual Learning');back.classList.add('hidden');main.innerHTML='';const d=document.createElement('div');d.className='menu';LESSONS.menu.forEach(x=>{const label=language==='en'?x.labelEn:x.label,b=document.createElement('button');b.innerHTML=`${label}<small>${x.ready?tr('進入禮節','Open ritual'):tr('內容後續加入','Content coming later')}</small>`;b.onclick=()=>x.ready?openLesson(x.id):pending(label);d.appendChild(b)});main.appendChild(d);defaultInfo(tr('請選擇要學習的禮節。','Choose a ritual to study.'))}
function pending(name){stop();currentPage='pending';currentMode='';saveState();title.textContent=name;back.classList.remove('hidden');main.innerHTML=`<div class="pending">${tr('此項禮節內容將於後續版本加入。','This ritual will be added in a later version.')}</div>`;defaultInfo(tr('此入口已保留，內容將於後續版本加入。','This menu item is reserved for a later version.'))}
function openLesson(id){back.classList.remove('hidden');if(id==='arrival')renderArrival('arrival');else if(id==='three')renderThree('tea');else if(id==='five')renderFive('tea');else if(id==='daily')renderDaily()}
function renderArrival(mode){stop();currentPage='arrival';currentMode=mode;saveState();title.textContent=tr('參駕、辭駕','Arrival and Farewell');back.classList.remove('hidden');main.innerHTML='';main.appendChild(selector([{label:tr('參駕','Arrival'),value:'arrival'},{label:tr('辭駕','Farewell'),value:'departure'}],mode,renderArrival));main.appendChild(table(buildArrival(mode)))}
function renderFive(mode){stop();currentPage='five';currentMode=mode;saveState();title.textContent=tr('獻供五人式','Five-Person Offering');back.classList.remove('hidden');main.innerHTML='';main.appendChild(selector([{label:tr('獻茶','Tea Offering'),value:'tea'},{label:tr('獻供','Fruit Offering'),value:'offering'}],mode,renderFive));main.appendChild(table(buildFive(mode),tr('先由上禮人獻結緣香三柱','The upper ritual participant first offers three sticks of affinity incense.')))}
function renderThree(mode){stop();currentPage='three';currentMode=mode;saveState();title.textContent=tr('獻供三人式','Three-Person Offering');back.classList.remove('hidden');main.innerHTML='';main.appendChild(selector([{label:tr('獻茶','Tea Offering'),value:'tea'},{label:tr('獻供','Fruit Offering'),value:'offering'}],mode,renderThree));main.appendChild(table(buildThree(mode)))}
function renderDaily(){stop();currentPage='daily';currentMode='';saveState();title.textContent=tr('平常日獻香','Daily Incense Offering');back.classList.remove('hidden');main.innerHTML='';main.appendChild(table(buildDaily()))}
function restore(){let s={};try{s=JSON.parse(localStorage.getItem('ritual-state')||'{}')}catch(e){}if(s.page==='arrival')renderArrival(s.mode||'arrival');else if(s.page==='three')renderThree(s.mode||'tea');else if(s.page==='five')renderFive(s.mode||'tea');else if(s.page==='daily')renderDaily();else home();requestAnimationFrame(()=>scrollTo(0,s.scrollY||0))}
function rerender(){if(currentPage==='arrival')renderArrival(currentMode||'arrival');else if(currentPage==='three')renderThree(currentMode||'tea');else if(currentPage==='five')renderFive(currentMode||'tea');else if(currentPage==='daily')renderDaily();else home()}
langBtn.onclick=()=>{language=language==='zh'?'en':'zh';langBtn.textContent=language==='zh'?'English':'中文';updateVoiceButton();saveState();rerender()};voiceBtn.onclick=()=>{stop(false);voice=voice==='male'?'female':'male';updateVoiceButton();saveState();rerender()};langBtn.textContent=language==='zh'?'English':'中文';updateVoiceButton();back.onclick=home;stopBtn.onclick=()=>stop(true);
window.handleAndroidBack=()=>{if(currentPage!=='home'){home();return true}return false};document.addEventListener('visibilitychange',()=>{if(document.hidden){saveState();stop(false)}});window.addEventListener('pagehide',saveState);restore();
</script><script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
}
</script></body></html>
